# The only workflow in this public repo (prebutton spec D-024). The `ci` job is the required
# status check on main (scripts/branch-protection.sh, D-021): the guard, then lint and unit
# tests. Read-only token, no credentials of any kind; scripts/ci-guard.sh fails the build if
# any workflow here gains a credential reference or a privileged trigger. Integration, e2e and
# deploy gates run only in GetWorkDone-private.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard workflows
        run: bash scripts/ci-guard.sh

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Installed with npm rather than Corepack, whose bundled signing keys can be stale.
      - name: Install pnpm
        run: npm install --global pnpm@10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit
        run: pnpm test:unit
